<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Tradelog{% endblock %}</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: "#0ea5e9", dark: "#0284c7" },
            gain: "#22c55e",
            loss: "#ef4444",
          }
        }
      }
    }
  </script>

  <!-- Chart.js (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- TradingView Lightweight Charts v5 (CDN) -->
  <script src="https://unpkg.com/lightweight-charts@5.0.5/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    body { background: #0f172a; color: #f1f5f9; font-family: 'Inter', sans-serif; }
    .card { @apply bg-slate-800 rounded-xl border border-slate-700 p-5; }
    .gain { color: #22c55e; }
    .loss { color: #ef4444; }
    .nav-link { @apply px-4 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-700 transition-colors text-sm font-medium; }
    .nav-link.active { @apply text-white bg-slate-700; }
  </style>
</head>
<body class="h-full">

  <!-- Sidebar nav -->
  <div class="flex h-full min-h-screen">
    <nav class="w-56 shrink-0 bg-slate-900 border-r border-slate-700 flex flex-col p-4 gap-1 fixed h-full z-10">
      <div class="mb-6 px-2">
        <span class="text-white font-bold text-lg tracking-tight">📈 Tradelog</span>
      </div>
      <a href="/tradelog/" class="nav-link {% if request.path == '/tradelog/' or request.path == '/tradelog' %}active{% endif %}">
        Dashboard
      </a>
      <a href="/tradelog/trades" class="nav-link {% if '/trades' in request.path %}active{% endif %}">
        Sessions
      </a>
      <a href="/tradelog/journal" class="nav-link {% if '/journal' in request.path %}active{% endif %}">
        Journal
      </a>
      <a href="/tradelog/import" class="nav-link {% if '/import' in request.path %}active{% endif %}">
        Import
      </a>

      <div class="mt-auto pt-4 border-t border-slate-700 px-2">
        <span class="text-slate-600 text-xs">Tradelog</span>
      </div>
    </nav>

    <!-- Main content -->
    <main class="ml-56 flex-1 p-6 overflow-auto">
      {% block content %}{% endblock %}
    </main>
  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
