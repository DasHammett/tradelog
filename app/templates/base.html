<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Tradelog{% endblock %}</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: "#0ea5e9", dark: "#0284c7" },
            gain: "#22c55e",
            loss: "#ef4444",
          }
        }
      }
    }
  </script>

  <!-- Chart.js (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- TradingView Lightweight Charts v5 (CDN) -->
  <script src="https://unpkg.com/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    body { background: #0f172a; color: #f1f5f9; font-family: 'Inter', sans-serif; }
    .card { @apply bg-slate-800 rounded-xl border border-slate-700 p-5; }
    .gain { color: #22c55e; }
    .loss { color: #ef4444; }

    /* ── Collapsible sidebar ── */
    :root { --nav-w: 14rem; }
    html.nav-collapsed { --nav-w: 4rem; }
    .sidebar      { width: var(--nav-w); overflow: hidden; transition: width .2s ease; }
    .main-content { margin-left: var(--nav-w); min-width: 0; transition: margin-left .2s ease; }

    .nav-link {
      display: flex; align-items: center; gap: .75rem;
      padding: .5rem 1rem; border-radius: .5rem; white-space: nowrap;
      color: #cbd5e1; font-size: .875rem; font-weight: 500;
      transition: color .15s, background-color .15s;
    }
    .nav-link:hover  { color: #fff; background: #334155; }
    .nav-link.active { color: #fff; background: #334155; }
    .nav-link svg    { width: 1.25rem; height: 1.25rem; flex-shrink: 0; }

    .nav-toggle {
      display: flex; align-items: center; justify-content: center;
      width: 2rem; height: 2rem; border-radius: .5rem; flex-shrink: 0;
      color: #94a3b8; transition: color .15s, background-color .15s;
    }
    .nav-toggle:hover { color: #fff; background: #334155; }
    .nav-toggle svg   { width: 1.25rem; height: 1.25rem; }

    html.nav-collapsed .nav-label,
    html.nav-collapsed .nav-brand,
    html.nav-collapsed .nav-foot  { display: none; }
    html.nav-collapsed .nav-link  { justify-content: center; padding-left: 0; padding-right: 0; }
    html.nav-collapsed .nav-head  { justify-content: center; padding-left: 0; padding-right: 0; }
  </style>

  <!-- Restore sidebar state before first paint (no flash) -->
  <script>
    try { if (localStorage.getItem("tradelog.nav") === "collapsed") document.documentElement.classList.add("nav-collapsed"); } catch (e) {}
  </script>
</head>
<body class="h-full">

  <!-- Sidebar nav (collapses to an icon rail) -->
  <div class="flex h-full min-h-screen">
    <nav id="sidebar" class="sidebar shrink-0 bg-slate-900 border-r border-slate-700 flex flex-col p-4 gap-1 fixed h-full z-10">
      <div class="nav-head mb-6 px-2 flex items-center justify-between">
        <span class="nav-brand text-white font-bold text-lg tracking-tight whitespace-nowrap">📈 Tradelog</span>
        <button id="navToggle" type="button" class="nav-toggle" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>

      <a href="/tradelog/" title="Dashboard" class="nav-link {% if request.path == '/tradelog/' or request.path == '/tradelog' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span class="nav-label">Dashboard</span>
      </a>
      <a href="/tradelog/trades" title="Trades" class="nav-link {% if '/trades' in request.path %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
        <span class="nav-label">Trades</span>
      </a>
      <a href="/tradelog/calendar" title="Calendar" class="nav-link {% if '/calendar' in request.path %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>
        <span class="nav-label">Calendar</span>
      </a>
      <a href="/tradelog/journal" title="Journal" class="nav-link {% if '/journal' in request.path %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 012-2h12v18H6a2 2 0 01-2-2V5z"/><path d="M8 7h6M8 11h6"/></svg>
        <span class="nav-label">Journal</span>
      </a>
      <a href="/tradelog/import" title="Import" class="nav-link {% if '/import' in request.path %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
        <span class="nav-label">Import</span>
      </a>

      <div class="nav-foot mt-auto pt-4 border-t border-slate-700 px-2">
        <span class="text-slate-600 text-xs">Tradelog</span>
      </div>
    </nav>

    <!-- Main content -->
    <main class="main-content flex-1 p-6 overflow-auto">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    (function () {
      const root = document.documentElement;
      const btn  = document.getElementById("navToggle");
      const nav  = document.getElementById("sidebar");

      function sync() {
        const collapsed = root.classList.contains("nav-collapsed");
        const label = collapsed ? "Expand sidebar" : "Collapse sidebar";
        btn.setAttribute("aria-expanded", String(!collapsed));
        btn.setAttribute("aria-label", label);
        btn.title = label;
      }
      sync();

      btn.addEventListener("click", () => {
        root.classList.toggle("nav-collapsed");
        try { localStorage.setItem("tradelog.nav", root.classList.contains("nav-collapsed") ? "collapsed" : "expanded"); } catch (e) {}
        sync();
      });

      // Pages that size charts from window "resize" (trade chart) need a nudge once the
      // width transition has finished; ResizeObserver-based charts (dashboard) adapt by themselves.
      nav.addEventListener("transitionend", e => {
        if (e.propertyName === "width") window.dispatchEvent(new Event("resize"));
      });
    })();
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
