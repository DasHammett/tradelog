server {
    listen 80 default_server;
    server_name _;

    # Pi-hole admin — proxy to pihole-FTL on 8090
    location /admin {
        proxy_pass         http://127.0.0.1:8090;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Tradelog app — proxy to Gunicorn Unix socket
    location /tradelog {
        proxy_pass         http://unix:/run/tradelog/app.sock;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Root redirect to tradelog
    location = / {
        return 302 /tradelog/;
    }
}
